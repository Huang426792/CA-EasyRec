[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-easyrec"
version = "0.1.0"
description = "Confidence-aware false-negative mitigation for EasyRec-style recommendation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Di Liu"}
]
keywords = [
  "recommender-systems",
  "contrastive-learning",
  "false-negatives",
  "lightgcn",
  "easyrec",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.9,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
easyrec = [
  "accelerate==0.28.0",
  "sentence-transformers>=2.6",
  "sentencepiece==0.2.0",
  "transformers==4.40.0",
]
dev = [
  "build>=1.2",
]

[project.scripts]
ca-easyrec-demo = "ca_easyrec.demo:main"
ca-easyrec-teachers = "ca_easyrec.official:main"

[project.urls]
Repository = "https://github.com/Huang426792/CA-EasyRec"
Paper = "https://github.com/Huang426792/CA-EasyRec/tree/main/paper"
Upstream-EasyRec = "https://github.com/HKUDS/EasyRec"

[tool.setuptools.packages.find]
where = ["src"]
